# Build the image, let it check this repository, publish what passed.
#
# One workflow, because the quality gate and the build are the same thing here: the
# image is checked by running lefthook *inside* it against this checkout, with {gates}
# left empty — the CI case the contract promises its consumers. A separate quality-gates
# workflow would build the same image a second time to run the same jobs.
#
# One cell per architecture, each on a native runner, so a broken arm64 build is seen as
# such. Every push publishes, branches included — under the branch name and the commit,
# never under a version. The image is a gate, and a gate has to exist under a name
# before the merge that needs it; a branch that publishes also runs every publishing step
# before its merge does, so `main` is not where a broken one is found out. What branches
# leave in the registry, ghcr-cleanup.yml removes. Only pull requests from forks build
# without publishing: their token cannot write here.
#
# Every push to main — every merged pull request — asks the commits since the last
# release whether they call for one (.github/scripts/next-version). If they do, the
# digests just checked are tagged with the version and the GitHub release creates the
# tag. Tag, image tag and the `ref` a consumer writes in `remotes:` are one value, and
# nobody types it.
---
name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

# On main, runs queue rather than overlap: two merges in quick succession would
# otherwise both derive their version from the same previous tag. Elsewhere a newer push
# makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # gitlint asks git who is committing, and the container sees no ~/.gitconfig.
  # git's env-based configuration answers that, the same way compose.yaml does from .env.
  GIT_USER_NAME: github-actions
  GIT_USER_EMAIL: github-actions@users.noreply.github.com

jobs:
  # Which release the commits since the last one call for. On a pull request that is the
  # release its merge would cut — shown in the job summary, published nowhere.
  version:
    # A branch of this repository is already built by its push; a pull request from it
    # would build the same commit again. Pull requests from forks are what the trigger
    # is for.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      # Full history and every tag: the range starts at the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Captured, not piped: a step without `shell:` runs `bash -e` without pipefail, and
      # `next-version | tee` would let a refused tag through as an empty answer.
      - name: Derive the next version
        id: next
        run: |
          next="$(.github/scripts/next-version)"
          printf '%s\n' "${next}" | tee -a "${GITHUB_OUTPUT}"

      - name: Say which release this cuts
        env:
          PREVIOUS: ${{ steps.next.outputs.previous }}
          BUMP: ${{ steps.next.outputs.bump }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [ -n "${VERSION}" ]; then
            printf 'Since %s: **%s** bump, releases **v%s**.\n' "${PREVIOUS}" "${BUMP}" "${VERSION}"
          else
            printf 'Since %s: nothing that calls for a release.\n' "${PREVIOUS}"
          fi >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: version

    strategy:
      # Which architecture broke is the question; cancelling the other cell withholds it.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      # GHCR wants the path lowercase and an owner may carry capitals. Derived from the
      # owner rather than hardcoded, so a fork publishes into its own namespace — once,
      # into the job environment, so no later step has to remember the rule.
      - name: Derive the image name
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_REF=%s/%s/lefthook-qa-gates\n' "${REGISTRY}" "${owner}" >> "${GITHUB_ENV}"

      # Every push publishes; a pull request event only reaches here from a fork. The
      # version label is the release when this push to main cuts one, the commit
      # otherwise — a branch is never labelled with the version its merge would cut.
      - name: Decide whether this run publishes, and as which version
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ needs.version.outputs.version }}
        run: |
          publish=false
          version="${GITHUB_SHA}"
          if [ "${EVENT}" = push ]; then
            publish=true
            if [ "${REF}" = refs/heads/main ] && [ -n "${RELEASE}" ]; then
              version="${RELEASE}"
            fi
          fi
          printf 'PUBLISH=%s\nVERSION=%s\n' "${publish}" "${version}" >> "${GITHUB_ENV}"

      # The pull-request head, not the synthetic merge commit: the range checks report
      # on commits an author wrote and can amend. Full history for the same reason.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Repository code runs below, inside a container that sees the checkout; the
          # token has no business in .git/config.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- what the gates run against -----------------------------------------------
      #
      # When this run publishes, the image is pushed by digest and pulled back by that
      # digest before anything checks it: a digest is content-addressed, so what the
      # gates exercise is provably what the publish job will tag — not a second build
      # that merely shared a cache. Nothing is reachable by name until every cell has
      # passed; a cell outlived by a failing sibling leaves an untagged manifest, which
      # is the deliberate price for never tagging something unchecked. The SBOM and the
      # provenance travel with the digest.
      #
      # Otherwise — a pull request from a fork — the image is built into the local store.
      - name: Build and push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Pull it back by digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${IMAGE_REF}@${DIGEST}"
          docker tag "${IMAGE_REF}@${DIGEST}" lefthook-qa-gates:ci

      - name: Build into the local store
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Containerfile
          load: true
          tags: lefthook-qa-gates:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # lefthook inside the image, templates empty: every tool runs natively there.
      # {staged_files} is empty on a runner, hence --all-files. Run as the runner's
      # identity rather than the image's default user, the way a consumer's compose file
      # does with `user:` — the fixers then write files this job owns.
      - name: Run the gates from inside the image
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "${PWD}:/workspace" \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=user.name -e GIT_CONFIG_VALUE_0="${GIT_USER_NAME}" \
            -e GIT_CONFIG_KEY_1=user.email -e GIT_CONFIG_VALUE_1="${GIT_USER_EMAIL}" \
            lefthook-qa-gates:ci \
            lefthook run pre-commit --all-files --no-auto-install

      # Everything a branch adds over its target, before it can be merged. The tip of the
      # target rather than the merge base: what the author merged in from there is not
      # theirs to answer for. Once per run; the architecture does not change a commit
      # message.
      #
      # Two triggers reach it. A pull request from a fork arrives as a pull_request event
      # and names its target. A branch of this repository arrives as its push — the
      # pull_request event is skipped for it, since the push already built the commit —
      # and is checked against the default branch, which is where its pull request goes.
      - name: Check the range the merge would bring
        if: >-
          matrix.arch == 'amd64' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' && github.ref != 'refs/heads/main'))
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          docker run --rm -u "$(id -u):$(id -g)" -v "${PWD}:/workspace" \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=user.name -e GIT_CONFIG_VALUE_0="${GIT_USER_NAME}" \
            -e GIT_CONFIG_KEY_1=user.email -e GIT_CONFIG_VALUE_1="${GIT_USER_EMAIL}" \
            lefthook-qa-gates:ci \
            range-gates FETCH_HEAD

      # An artifact, not a job output: matrix outputs are last-writer-wins. The filename
      # is the value; the publish job only globs.
      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Carry the digest to the publish job
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs only when every cell passed: `needs` makes "publish what all architectures
  # passed" a property of the graph. Nothing is built here; the manifest list is
  # assembled from digests that were already checked.
  #
  # The same job on every push, so a branch walks the publishing path its merge will
  # walk. What only main does is the version: its tags and the release.
  publish:
    needs:
      - version
      - build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    # RELEASE is what the commits call for, on any branch; CUT is the release this push
    # actually makes, and is empty off main.
    env:
      RELEASE: ${{ needs.version.outputs.version }}
      CUT: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.version || '' }}

    steps:
      - name: Derive the image name
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_REF=%s/%s/lefthook-qa-gates\n' "${REGISTRY}" "${owner}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag the commits call for must still be free — checked on every branch, so a
      # collision shows in the pull request, and again on main before a single version
      # tag is written, so a release never half-happens.
      #
      # The status is read rather than the exit code: 404 is free, 200 is taken, and
      # anything else is a question that went unanswered — which must not pass as free.
      - name: Check that the release tag is still free
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(gh api --include "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE}" 2>/dev/null |
            head -1 | awk '{print $2}')"
          case "${status}" in
            404) echo "v${RELEASE} is free" ;;
            200)
              echo "::error ::tag v${RELEASE} exists already — the release this merge calls for was cut before"
              exit 1
              ;;
            *)
              echo "::error ::could not ask whether v${RELEASE} exists (HTTP ${status:-none})"
              exit 1
              ;;
          esac

      # Image tag and contract `ref` come in pairs: `latest` is main, as a registry reader
      # expects it to be, and pairs with `ref: main`; `X.Y.Z` and `X.Y` pair with
      # `ref: vX.Y.Z`. A branch publishes under its name and every push under its commit;
      # neither ever carries a version.
      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REF }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}},value=v${{ env.CUT }},enable=${{ env.CUT != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.CUT }},enable=${{ env.CUT != '' }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # Word splitting is the mechanism: both substitutions expand to several words.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE_REF}@sha256:%s " *)

      # After the image, so the release never announces one that does not exist. The
      # release creates the tag — a lightweight one, on the commit this run checked. A
      # tag created with GITHUB_TOKEN starts no workflow, which is what is wanted: there
      # is nothing left to build for it.
      - name: Create the release and its tag
        if: env.CUT != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${CUT}" --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" --title "v${CUT}" --generate-notes
